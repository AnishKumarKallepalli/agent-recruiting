<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ava - AI Recruiting Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
/* ─── REPLACE THESE WITH REAL RECORDING URLS BEFORE DEMO ─── */
/* FOUNDER_CALL_AUDIO and ALEX_CALL_AUDIO are set in the JS below */

:root {
  --bg:#F7F5F0; --bg-card:#FFF; --bg-elev:#FAF8F3;
  --ink:#1A1814; --ink-1:#2C2924; --ink-2:#5C574E; --ink-3:#8A8479; --ink-4:#B5AEA0;
  --line:#E9E3D6; --line-2:#D9D2C2;
  --accent:#3F8F5F; --accent-soft:#E4F0E8;
  --warn:#C58A2A; --warn-soft:#F5EBD4;
  --r-md:10px; --r-lg:14px;
  --sh1:0 1px 0 rgba(0,0,0,.02),0 0 0 .5px rgba(0,0,0,.04);
  --sh2:0 1px 2px rgba(40,30,10,.04),0 0 0 .5px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:'Geist',ui-sans-serif,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;cursor:default}

/* layout */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px;height:52px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.brand-name{font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--ink-3);margin-top:-1px}
.topbar-mid{flex:1;display:flex;align-items:center;gap:12px;padding:0 12px}
.phase-chip{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-2)}
.phase-chip.active{background:var(--warn-soft);border-color:color-mix(in oklch,var(--warn) 30%,transparent);color:var(--warn)}
.phase-chip.done{background:var(--accent-soft);border-color:color-mix(in oklch,var(--accent) 30%,transparent);color:var(--accent)}
.timer{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink-3)}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.live-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
.live-badge.on{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in oklch,var(--accent) 30%,transparent)}
.live-badge.off{background:var(--bg-elev);color:var(--ink-3);border:1px solid var(--line)}

/* pulse dot */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.pulse{animation:dpulse 1.4s ease-in-out infinite}
@keyframes dpulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* main layout */
.main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:0;max-width:1300px;width:100%;margin:0 auto;padding:24px 28px 60px;gap:20px}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.right{display:flex;flex-direction:column;gap:16px}

/* card base */
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2)}
.card-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;letter-spacing:-.005em}
.card-sub{font-size:11.5px;color:var(--ink-3)}

/* ─── IDLE HERO ─── */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:60px 0;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);border:1px solid color-mix(in oklch,var(--accent) 35%,transparent);color:var(--accent);font-size:12px;font-weight:500}
.hero h1{font-size:42px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero-sub{font-size:16px;color:var(--ink-2);max-width:420px;line-height:1.55}
.hero-phone{font-family:'Geist Mono',monospace;font-size:20px;color:var(--ink-1);letter-spacing:.04em;background:var(--bg-elev);border:1px solid var(--line-2);padding:10px 22px;border-radius:10px}
.btn-start{appearance:none;background:var(--ink);color:#fff;border:none;padding:13px 32px;border-radius:10px;font-size:15px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px;transition:background .15s,transform .1s;cursor:pointer}
.btn-start:hover{background:#2c2924;transform:translateY(-1px)}
.btn-start:active{transform:translateY(0)}
.hero-note{font-size:12px;color:var(--ink-4)}

/* ─── CALL CARD ─── */
.call-card{padding:20px;display:flex;flex-direction:column;gap:14px}
.call-who{display:flex;align-items:center;gap:14px}
.call-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0;border:2px solid var(--line)}
.call-avatar.founder{background:linear-gradient(135deg,#2c2924,#5c574e);color:#fff}
.call-avatar.alex{background:linear-gradient(135deg,var(--accent),#2a6845);color:#fff}
.call-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.call-number{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink-3);margin-top:2px}
.call-status{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.call-timer{font-family:'Geist Mono',monospace;font-size:18px;font-weight:500;color:var(--ink)}
.call-live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--warn)}
.call-wave{display:flex;align-items:center;gap:3px;height:20px}
.call-wave span{display:block;width:3px;background:var(--warn);border-radius:2px;animation:wave .8s ease-in-out infinite}
.call-wave span:nth-child(1){height:8px;animation-delay:0s}
.call-wave span:nth-child(2){height:14px;animation-delay:.1s}
.call-wave span:nth-child(3){height:20px;animation-delay:.2s}
.call-wave span:nth-child(4){height:14px;animation-delay:.3s}
.call-wave span:nth-child(5){height:8px;animation-delay:.4s}
@keyframes wave{0%,100%{transform:scaleY(.4);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.call-ended .call-wave span{background:var(--ink-4);animation:none;height:4px}

/* audio player */
.audio-section{padding:0 20px 16px}
.audio-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500;margin-bottom:8px}
.audio-player{width:100%;height:36px;border-radius:8px;outline:none;accent-color:var(--accent)}
.audio-missing{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink-3)}

/* ─── TRANSCRIPT ─── */
.transcript{display:flex;flex-direction:column;gap:14px;padding:18px 22px;overflow-y:auto;max-height:420px;scroll-behavior:smooth}
.transcript::-webkit-scrollbar{width:4px}
.transcript::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.tline{display:flex;gap:10px;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tline-founder,.tline-user,.tline-alex{justify-content:flex-start}
.tline-ava{justify-content:flex-end}
.tbubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5}
.tline-founder .tbubble,.tline-user .tbubble,.tline-alex .tbubble{background:var(--bg-elev);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink-1)}
.tline-ava .tbubble{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.tspeaker{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
.tline-ava .tspeaker{text-align:right;color:rgba(255,255,255,.5);display:none}
.tline-typing .tbubble{background:var(--bg-elev);border:1px solid var(--line);padding:10px 14px}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:tb 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.30s}
@keyframes tb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-3px);opacity:1}}

/* ─── ROLE CARD ─── */
.role-card{padding:20px 22px}
.role-eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:6px}
.role-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;line-height:1.1}
.role-company{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-1);margin-bottom:16px}
.co-mark{width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.role-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 10px;border-radius:999px;font-size:11.5px;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.tag.must{background:var(--accent-soft);border-color:color-mix(in oklch,var(--accent) 30%,transparent);color:var(--accent)}

/* ─── CANDIDATES ─── */
.cand-section{display:flex;flex-direction:column}
.cand-row{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(160px,1.4fr) 100px 130px;gap:14px;padding:11px 20px;align-items:center;border-top:1px solid var(--line);animation:fadein .35s ease;transition:background .12s}
.cand-row:hover{background:var(--bg-elev)}
.cand-head-row{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500;border-top:none;cursor:default;padding-top:8px;padding-bottom:8px}
.cand-head-row:hover{background:transparent}
.cand-name-cell{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--bg-elev);border:1px solid var(--line-2);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink-2);flex-shrink:0}
.av.highlight{background:linear-gradient(135deg,var(--accent),#2a6845);color:#fff;border-color:transparent}
.cname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cloc{font-size:11px;color:var(--ink-3);margin-top:1px}
.ctitle{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.fit-bar{flex:1;height:5px;background:var(--bg-elev);border-radius:3px;overflow:hidden;max-width:60px;border:1px solid var(--line)}
.fit-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s ease}
.fit-fill.mid{background:var(--warn)}
.fit-fill.low{background:var(--ink-4)}
.fit-num{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink-1);min-width:20px;text-align:right}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill-muted{background:#F1ECE0;color:var(--ink-3)}
.pill-neutral{background:var(--bg-elev);color:var(--ink-2);border-color:var(--line)}
.pill-live{background:var(--warn-soft);color:var(--warn)}
.pill-live::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);animation:pip 1.2s ease-in-out infinite}
@keyframes pip{0%,100%{opacity:.3}50%{opacity:1}}
.pill-good{background:var(--accent-soft);color:var(--accent)}
.pill-fail{background:#FEF2F2;color:#B45050;border-color:color-mix(in oklch,#B45050 20%,transparent)}
.pill-accent{background:var(--accent);color:#fff}
.pill-accent::before{background:#fff}

/* row states */
.cand-row-calling{background:linear-gradient(to right,var(--warn-soft) 0%,transparent 50%)}
.cand-row-calling:hover{background:linear-gradient(to right,color-mix(in oklch,var(--warn-soft) 90%,var(--bg-elev)) 0%,var(--bg-elev) 50%)}
.cand-row-qualified,.cand-row-contacted{background:linear-gradient(to right,var(--accent-soft) 0%,transparent 50%)}
.cand-row-qualified:hover,.cand-row-contacted:hover{background:linear-gradient(to right,color-mix(in oklch,var(--accent-soft) 80%,var(--bg-elev)) 0%,var(--bg-elev) 50%)}
.cand-empty{padding:24px 20px;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line)}

/* ─── PIPELINE (right column) ─── */
.pipeline-steps{padding:16px 18px 18px;display:flex;flex-direction:column;gap:0}
.pstep{display:flex;gap:12px;position:relative;padding-bottom:4px}
.pstep:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:1.5px;background:var(--line);z-index:0}
.pstep-done:not(:last-child)::before{background:var(--accent)}
.pnode{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);flex-shrink:0;z-index:1;transition:all .25s ease}
.pstep-done .pnode{background:var(--accent);border-color:var(--accent);color:#fff}
.pstep-active .pnode{border-color:var(--accent);color:var(--accent);background:var(--bg-card)}
.pbody{padding:3px 0 16px}
.plabel{font-size:12.5px;font-weight:500;color:var(--ink-2);transition:color .2s}
.pstep-done .plabel,.pstep-active .plabel{color:var(--ink)}
.pctx{font-size:11px;color:var(--ink-3);margin-top:2px}
.pstep-active .pctx{color:var(--accent)}

/* ─── ACTIVITY ─── */
.act-list{padding:8px 16px 12px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;max-height:300px}
.act-list::-webkit-scrollbar{width:4px}
.act-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.aitem{display:flex;gap:9px;padding:6px 2px;animation:fadein .3s ease}
.aicon{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;font-family:'Geist Mono',monospace;flex-shrink:0;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-3)}
.aicon-ava{background:var(--ink);color:#fff;border-color:var(--ink)}
.aicon-find{background:var(--bg-elev);color:var(--ink-2)}
.aicon-call{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in oklch,var(--warn) 25%,transparent)}
.aicon-score{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in oklch,var(--accent) 25%,transparent)}
.aicon-send{background:var(--accent);color:#fff;border-color:var(--accent)}
.atext{font-size:12px;color:var(--ink-1);line-height:1.4;padding-top:2px}

/* ─── EMAIL PREVIEW ─── */
.email-preview{padding:16px 20px}
.email-from{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.email-subject{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px}
.email-body{font-size:12.5px;color:var(--ink-2);line-height:1.6;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-line}
.email-cta{display:inline-block;margin-top:12px;padding:10px 20px;background:var(--ink);color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}

/* ─── ALEX DETAIL PANEL ─── */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50;display:flex;align-items:stretch;justify-content:flex-end;animation:fadein .2s ease}
.detail-panel{width:480px;max-width:90vw;background:var(--bg-card);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.detail-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.detail-title{font-size:15px;font-weight:600}
.detail-close{appearance:none;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-2);width:28px;height:28px;border-radius:7px;font-size:14px;display:grid;place-items:center;cursor:pointer}
.detail-close:hover{background:var(--line);color:var(--ink)}
.detail-body{flex:1;overflow-y:auto;padding:0 0 20px}
.detail-section{padding:16px 20px 0}
.detail-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--ink-3);margin-bottom:10px}
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.dmeta-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;margin-bottom:3px}
.dmeta-v{font-size:13px;color:var(--ink-1);font-weight:500}
.fit-reason-box{font-size:12.5px;color:var(--ink-2);line-height:1.55;background:var(--accent-soft);border:1px solid color-mix(in oklch,var(--accent) 30%,transparent);border-radius:8px;padding:12px 14px;margin-top:4px}
.detail-transcript{padding:12px 0 0}

@media(max-width:960px){
  .main{grid-template-columns:1fr}
  .right{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// DEMO DATA -swap transcripts + audio URLs with real recordings
// ═══════════════════════════════════════════════════════════════════

// Set to recording URL after calls are made, e.g. "https://..."
const FOUNDER_CALL_AUDIO = "https://ava-production-cf8f.up.railway.app/api/recordings/founder";
const ALEX_CALL_AUDIO    = "https://ava-production-cf8f.up.railway.app/api/recordings/alex";

const DEMO_ROLE = {
  title: "Founding AI Engineer",
  company: "NovaMind",
  location: "San Francisco, CA",
  comp: "$150-200k + equity",
  must_haves: ["Python", "LLM experience", "Voice AI"],
  nice_haves: ["Startup experience", "Scaling expertise"],
  dealbreakers: "Big-tech only; new grads",
  booking_link: "cal.com/novamind",
};

const FOUNDER_TRANSCRIPT = [
  { speaker:"Ava",     text:"Hi! I'm Ava, your AI recruiting agent. I'll ask a few quick questions about the role, then take it from there. What role are you hiring for?" },
  { speaker:"Founder", text:"I'm looking to hire a founding AI engineer." },
  { speaker:"Ava",     text:"Got it. And tell me a bit about NovaMind - what are you building?" },
  { speaker:"Founder", text:"We're building AI that replicates the voice of someone you've lost - a parent, a grandparent. You can have real conversations with them again. It's deeply personal AI." },
  { speaker:"Ava",     text:"That's a really powerful problem to work on. What are the must-haves for this person?" },
  { speaker:"Founder", text:"Python, LLM experience, and solid voice AI - both product and infrastructure." },
  { speaker:"Ava",     text:"Nice. Any good-to-haves on top of that?" },
  { speaker:"Founder", text:"Startup experience, someone who's done scaling. Ideally they've been at a fast-moving company like Stripe or Notion in the early days." },
  { speaker:"Ava",     text:"Makes sense. Where is the role based, and what's the comp range?" },
  { speaker:"Founder", text:"In-person, five days a week in SF. Around $150k to $200k." },
  { speaker:"Ava",     text:"Got it. Any hard dealbreakers I should screen for?" },
  { speaker:"Founder", text:"No big-tech-only backgrounds. No new grads - I need people with real shipping experience." },
  { speaker:"Ava",     text:"One last thing - do you have a booking link so qualified candidates can schedule time with you?" },
  { speaker:"Founder", text:"Yeah, cal.com/novamind." },
  { speaker:"Ava",     text:"Perfect, just want to make sure I have this right - Founding AI Engineer at NovaMind, in-person SF, $150-200k, Python plus LLM plus Voice AI required, no big-tech-only or new grads. I'll start finding candidates right now!" },
];

const PHASES = {
  IDLE:              "idle",
  FOUNDER_ACTIVE:    "founder-active",
  FOUNDER_ENDED:     "founder-ended",
  SOURCING:          "sourcing",
  ALEX_CALLING:      "alex-calling",
  ALEX_ACTIVE:       "alex-active",
  ALEX_ENDED:        "alex-ended",
  COMPLETE:          "complete",
};

const PIPELINE_STEPS = [
  { id:"created",   label:"Role created",         ctx:(s,c)=>"1 role" },
  { id:"sourced",   label:"Candidates sourced",   ctx:(s,c)=>`${c.sourced} sourced` },
  { id:"called",    label:"Candidates screened",  ctx:(s,c)=>`${c.screened} screened` },
  { id:"qualified", label:"Candidates qualified", ctx:(s,c)=>`${c.qualified} qualified` },
  { id:"followup",  label:"Follow-ups sent",      ctx:(s,c)=>`${c.contacted} emails sent` },
];

function phaseToStepState(phase, sourcedCount) {
  const p = PHASES;
  const done  = (ids) => Object.fromEntries(ids.map(id=>[id,"done"]));
  const pend  = (...ids) => Object.fromEntries(ids.map(id=>[id,"pending"]));
  const act   = (id) => ({[id]:"active"});

  if (phase === p.IDLE)           return {...pend("created","sourced","called","qualified","followup"), created:"active"};
  if (phase === p.FOUNDER_ACTIVE) return {...pend("sourced","called","qualified","followup"), created:"active"};
  if (phase === p.FOUNDER_ENDED)  return {...done(["created"]), ...act("sourced"), ...pend("called","qualified","followup")};
  if (phase === p.SOURCING)       return {...done(["created"]), ...act("sourced"), ...pend("called","qualified","followup")};
  if (phase === p.ALEX_CALLING)   return {...done(["created","sourced"]), ...act("called"), ...pend("qualified","followup")};
  if (phase === p.ALEX_ACTIVE)    return {...done(["created","sourced"]), ...act("called"), ...pend("qualified","followup")};
  if (phase === p.ALEX_ENDED)     return {...done(["created","sourced","called"]), ...act("qualified"), ...pend("followup")};
  if (phase === p.COMPLETE)       return {...done(["created","sourced","called","qualified","followup"])};
  return {};
}

function Dot({ pulse=false }) {
  return <span className={`dot${pulse?" pulse":""}`} />;
}

function FitBar({ score }) {
  const cls = score>=85?"":score>=70?"mid":"low";
  return (
    <div className="fit">
      <div className="fit-bar"><div className={`fit-fill ${cls}`} style={{width:`${score}%`}} /></div>
      <span className="fit-num">{score}</span>
    </div>
  );
}

function CandPill({ status }) {
  const map = {
    sourced:   ["neutral","Sourced"],
    calling:   ["live","On call"],
    qualified: ["good","Qualified"],
    contacted: ["accent","Follow-up done"],
    "not-fit": ["fail","Not fit"],
    passed:    ["muted","Not fit"],
  };
  const [tone,label] = map[status]||["muted","—"];
  return <span className={`pill pill-${tone}`}>{label}</span>;
}

function fmtTime(s) {
  const m=Math.floor(s/60), sec=s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function CallCard({ who, timer, ended }) {

function Transcript({ lines, typingAs }) {
  const ref = useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.scrollTop=ref.current.scrollHeight; },[lines.length, typingAs]);
  const isRight = (s) => s==="Ava";
  return (
    <div className="transcript" ref={ref}>
      {lines.filter(Boolean).map((l,i)=>{
        const cls = l.speaker==="Ava"?"tline-ava":l.speaker==="Alex"?"tline-alex":l.speaker==="Founder"?"tline-founder":"tline-user";
        return (
          <div key={i} className={`tline ${cls}`}>

              <div className="card">
                <div className="role-card">
                  <div className="role-eyebrow">Role brief extracted</div>
                  <div className="role-title">{DEMO_ROLE.title}</div>
                  <div className="role-company">
                    <div className="co-mark">{DEMO_ROLE.company[0]}</div>
                    <span>{DEMO_ROLE.company}</span>
                    <span style={{color:"var(--ink-4)"}}>·</span>
                    <span style={{color:"var(--ink-3)"}}>{DEMO_ROLE.location}</span>
                    <span style={{color:"var(--ink-4)"}}>·</span>
                    <span style={{color:"var(--ink-3)"}}>{DEMO_ROLE.comp}</span>
                  </div>
                  <div className="role-tags">
                    {DEMO_ROLE.must_haves.map(s=><span key={s} className="tag must">{s}</span>)}
                    {DEMO_ROLE.nice_haves.map(s=><span key={s} className="tag">{s}</span>)}
                  </div>
                </div>
              </div>
            )}


            {/* Candidates table */}
            {sourcedCands.length>0 && (
              <div className="card">
                <div className="card-head">
                  <div className="card-title">Candidates</div>
                  <div className="card-sub">{sourcedCands.length} sourced</div>
                </div>
                <div className="cand-section">
                  <div className="cand-row cand-head-row">
                    <div>Candidate</div><div>Title</div><div style={{textAlign:"right"}}>Fit</div><div>Status</div>
                  </div>
                  {sourcedCands.map(c=>{
                    const st = candStatus[c.id]||"sourced";
                    const canOpenAlex = c.isAlex && [PHASES.ALEX_ACTIVE,PHASES.ALEX_ENDED,PHASES.COMPLETE].includes(phase);
                    return (
                      <div
                        key={c.id}
                        className={`cand-row cand-row-${st}`}
                        onClick={canOpenAlex ? ()=>setShowAlex(true) : undefined}
                        style={canOpenAlex ? {cursor:"pointer"} : {}}
                      >
                        <div className="cand-name-cell">
                          <div className={`av${c.isAlex?" highlight":""}`}>{c.name.split(" ").map(p=>p[0]).join("").slice(0,2)}</div>
                          <div>
                            <div className="cname">{c.name}</div>
                            <div className="cloc mono">{c.loc}</div>
                          </div>
                        </div>
                        <div className="ctitle">{c.title}</div>
                        <div style={{textAlign:"right"}}><FitBar score={c.fit} /></div>
                        <div><CandPill status={st} /></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {/* RIGHT COLUMN */}
          <div className="right">
            <PipelinePanel phase={phase} sourcedCount={sourcedCands.length} qualifiedCount={qualifiedCount} contactedCount={contactedCount} screenedCount={screenedCount} />
            <ActivityPanel events={events} />
          </div>
        </div>
      )}

      {/* Alex detail panel — slide-in on row click */}
      {showAlex && (
        <AlexDetailPanel
          onClose={()=>setShowAlex(false)}
          transcriptLines={alexLines}
          transcriptDone={alexDone}
          typingAs={alexTypingAs}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
